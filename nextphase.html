</style></head><body><header><h1>立替・精算 ／ ふるさと納税</h1><p class="muted">家計管理アプリ追加台帳 RC4（管理画面から一元入力）</p></header><main><nav id="tabs" class="tabs" aria-label="機能切替"></nav><div id="content"></div><div id="flash" role="status" aria-live="polite"></div></main><footer>RC4 / 一元入力 / 家計収支への反映を確認できます</footer><script>// Pure reference calculations for Tokuhara Kakeibo next-phase prototype.
// This module NEVER writes to Firebase or the main household finance data.
const POOLS = Object.freeze(['tocchan','sae','joint']);
const LABELS = Object.freeze({tocchan:'とっくん',sae:'さえさん',joint:'共同口座'});
const isDate = x => typeof x==='string' && /^\d{4}-\d{2}-\d{2}$/.test(x) && !Number.isNaN(new Date(x+'T12:00:00Z').getTime()) && new Date(x+'T12:00:00Z').toISOString().slice(0,10)===x;
const isPool = x => POOLS.includes(x);
function validateMoney(x,{allowZero=false}={}) {
  if(typeof x!=='number' || !Number.isSafeInteger(x) || x<0 || (!allowZero && x===0)) throw new Error('金額は正の整数（円）で入力してください');
  return x;
}
const validEvent=(e,kind)=>{
  if(!e || typeof e!=='object' || typeof e.id!=='string' || !e.id.trim() || !isDate(e.date))throw Error(`${kind}: IDまたは日付が不正です`);
  if(e.cashDate!=null&&e.cashDate!==''&&!isDate(e.cashDate))throw Error(`${kind}: 引落日が不正です`);
  validateMoney(e.amount);
};
function validateAdvance(c){
  if(!c||typeof c!=='object'||!c.id||!String(c.title||'').trim()||!isPool(c.owner))throw Error('立替案件の基本情報が不正です');
  if(!['draft','submitted','approved','closed'].includes(c.status))throw Error('立替案件の状態が不正です');
  for(const key of ['payments','receipts','transfers'])if(!Array.isArray(c[key]))throw Error(`${key}は配列です`);
  const ids=new Set();
  const unique=(v)=>{if(ids.has(v.id))throw Error('案件内に同じ明細IDがあります');ids.add(v.id)};
  c.payments.forEach(p=>{validEvent(p,'支出');unique(p);if(!isPool(p.from))throw Error('支出元を選択してください');if(p.existingExpenseRef!=null&&typeof p.existingExpenseRef!=='string')throw Error('既存支出への参照が不正です')});
  c.receipts.forEach(r=>{
    validEvent(r,'入金');unique(r);
    if(!isPool(r.to))throw Error('入金先を選択してください');
    validateMoney(r.reimbursementAmount,{allowZero:true});validateMoney(r.allowanceAmount,{allowZero:true});
    if(r.reimbursementAmount+r.allowanceAmount!==r.amount)throw Error('入金額と実費・日当の内訳が一致しません');
  });
  c.transfers.forEach(t=>{validEvent(t,'家計内振込');unique(t);if(!isPool(t.from)||!isPool(t.to)||t.from===t.to)throw Error('家計内振込元・先が不正です')});
  if(c.approvedAmount!=null)validateMoney(c.approvedAmount,{allowZero:true});
  if(c.allowanceExpectedAmount!=null)validateMoney(c.allowanceExpectedAmount,{allowZero:true});
  if(c.status==='closed'){
    if(c.approvedAmount==null||c.allowanceExpectedAmount==null)throw Error('精算完了には実費承認額と日当合計額の両方を確定してください（支給なしは0円）');
    const reimbursed=sum(c.receipts.map(r=>r.reimbursementAmount));
    const allowances=sum(c.receipts.map(r=>r.allowanceAmount));
    if(reimbursed!==c.approvedAmount||allowances!==c.allowanceExpectedAmount)throw Error('精算完了には実費・日当の両方の入金額を確認してください');
  }
  return c;
}
const sum=a=>a.reduce((x,y)=>x+y,0);
// Partial or unexpected company remittances cannot be allocated safely by guesswork.
// Automatic allocation is allowed only when the incoming amount matches the exact
// outstanding total of both known components. Otherwise request an explicit split.
function suggestReceiptSplit(c,amount){
  validateMoney(amount);
  if(c.approvedAmount===null||c.approvedAmount===undefined||c.allowanceExpectedAmount===null||c.allowanceExpectedAmount===undefined)return null;
  const remReimb=c.approvedAmount-sum(c.receipts.map(r=>r.reimbursementAmount));
  const remAllowance=c.allowanceExpectedAmount-sum(c.receipts.map(r=>r.allowanceAmount));
  if(remReimb<0||remAllowance<0||remReimb+remAllowance!==amount)return null;
  return {reimbursementAmount:remReimb,allowanceAmount:remAllowance};
}
function summarizeAdvance(c){
  validateAdvance(c);
  const paid=sum(c.payments.map(x=>x.amount));
  const reimbursed=sum(c.receipts.map(x=>x.reimbursementAmount));
  const allowances=sum(c.receipts.map(x=>x.allowanceAmount));
  const received=reimbursed+allowances;
  const approved=c.approvedAmount??null;
  const allowanceExpected=c.allowanceExpectedAmount??null;
  const expectedTotal=approved===null||allowanceExpected===null?null:approved+allowanceExpected;
  const pendingReimbursement=approved===null?null:Math.max(approved-reimbursed,0);
  const pendingAllowance=allowanceExpected===null?null:Math.max(allowanceExpected-allowances,0);
  const pending=expectedTotal===null?null:Math.max(expectedTotal-received,0);
  const estimatedSelf=approved===null?null:paid-approved;
  const finalSelf=c.status==='closed'?paid-reimbursed:null;
  const net=Object.fromEntries(POOLS.map(x=>[x,0]));
  for(const p of c.payments)net[p.from]-=p.amount;
  for(const r of c.receipts)net[r.to]+=r.amount;
  for(const t of c.transfers){net[t.from]-=t.amount;net[t.to]+=t.amount;}
  const goal=Object.fromEntries(POOLS.map(x=>[x,x===c.owner?received-paid:0]));
  const difference=Object.fromEntries(POOLS.map(x=>[x,goal[x]-net[x]]));
  const debtors=POOLS.filter(x=>difference[x]<0).map(x=>({pool:x,amount:-difference[x]}));
  const creditors=POOLS.filter(x=>difference[x]>0).map(x=>({pool:x,amount:difference[x]}));
  const transfers=[];
  for(const d of debtors)for(const cr of creditors){const amount=Math.min(d.amount,cr.amount);if(amount>0){transfers.push({from:d.pool,to:cr.pool,amount});d.amount-=amount;cr.amount-=amount;}}
  if(sum(Object.values(difference))!==0 || sum(debtors.map(x=>x.amount))||sum(creditors.map(x=>x.amount)))throw Error('振込計算の整合性エラー');
  const months={};
  const add=(date,pool,amount)=>{const m=date.slice(0,7);months[m]??={tocchan:0,sae:0,joint:0};months[m][pool]+=amount;};
  for(const p of c.payments)add(p.cashDate||p.date,p.from,-p.amount);
  for(const r of c.receipts)add(r.date,r.to,r.amount);
  for(const t of c.transfers){add(t.date,t.from,-t.amount);add(t.date,t.to,t.amount)}
  return {paid,reimbursed,allowances,received,approved,allowanceExpected,expectedTotal,pending,pendingReimbursement,pendingAllowance,estimatedSelf,finalSelf,net,goal,difference,proposedTransfers:transfers,months,companySettled:c.status==='closed',reimbursementOverpaid:approved===null?0:Math.max(0,reimbursed-approved),allowanceOverpaid:allowanceExpected===null?0:Math.max(0,allowances-allowanceExpected)};
}
// Imports older standalone v0.1/v0.2 JSON without assuming that two entries
// dated alike were necessarily one bank transfer. Historical entries stay separate.
function upgradeState(input){
  if(!input||typeof input!=='object')throw Error('不正な保存データです');
  if(input.schema===2)return structuredClone(input);
  if(input.schema!==1)throw Error('未対応のデータ形式です');
  const state=structuredClone(input);state.schema=2;
  for(const c of state.advances){
    c.allowanceExpectedAmount=null; // unknown is NOT equivalent to zero
    for(const r of c.receipts){
      r.reimbursementAmount=r.kind==='allowance'?0:r.amount;
      r.allowanceAmount=r.kind==='allowance'?r.amount:0;
      delete r.kind;
    }
    // Old 'closed' did not validate full payment and no allowance expected existed.
    // Downgrade to 'approved' until both amounts are explicitly confirmed.
    if(c.status==='closed')c.status='approved';
  }
  verifyState(state);
  return state;
}
function validateDonation(d){
  if(!d||typeof d!=='object'||!d.id||!isDate(d.date)||!isPool(d.donor)||d.donor==='joint'||!isPool(d.paidFrom)||!isPool(d.economicBearer??d.donor)||typeof d.municipality!=='string'||!d.municipality.trim())throw Error('寄附の基本情報が不正です');
  validateMoney(d.amount);
  if(d.cashDate!=null&&d.cashDate!==''&&!isDate(d.cashDate))throw Error('寄附の実引落日が不正です');
  if(!['unselected','onestop','return'].includes(d.filingMethod))throw Error('申告方法が不正です');
  if(!['not_started','submitted','confirmed'].includes(d.applicationStatus))throw Error('申請状態が不正です');
  if(d.settlementDate!=null&&d.settlementDate!==''&&!isDate(d.settlementDate))throw Error('家計内補填日が不正です');
  if(d.linkedExpenseRef!=null&&typeof d.linkedExpenseRef!=='string')throw Error('既存支出参照が不正です');
  return d;
}
function validateDonations(ds){
  if(!Array.isArray(ds))throw Error('寄附は配列です');
  const ids=new Set(), expenseIds=new Set();
  ds.forEach(d=>{validateDonation(d);if(ids.has(d.id))throw Error('寄附IDが重複しています');ids.add(d.id);if(d.linkedExpenseRef){if(expenseIds.has(d.linkedExpenseRef))throw Error('既存支出の重複紐付けは禁止です');expenseIds.add(d.linkedExpenseRef)}});
  return ds;
}
function summarizeDonations(ds,year,donor,{limit=null,verifiedIncomeTax=0,verifiedResidentTax=0}={}){
  validateDonations(ds);
  if(!Number.isInteger(year)||year<2000||year>2100||!['tocchan','sae'].includes(donor))throw Error('対象年度・寄附者が不正です');
  if(limit!==null)validateMoney(limit,{allowZero:true});
  validateMoney(verifiedIncomeTax,{allowZero:true});validateMoney(verifiedResidentTax,{allowZero:true});
  const rows=ds.filter(d=>d.date.startsWith(String(year)+'-')&&d.donor===donor);
  const total=sum(rows.map(d=>d.amount));
  const candidateDeduction=Math.max(total-2000,0); // NOT guaranteed actual tax credit
  const verified=verifiedIncomeTax+verifiedResidentTax;
  const requiredTransfers=rows.filter(d=>d.paidFrom!==(d.economicBearer??d.donor)&&!d.settlementDate).map(d=>({from:d.economicBearer??d.donor,to:d.paidFrom,amount:d.amount,donationId:d.id}));
  return {rows,total,municipalities:new Set(rows.map(x=>x.municipality.trim())).size,candidateDeduction,limit,limitRemaining:limit===null?null:limit-total,limitExceeded:limit!==null&&total>limit,verifiedIncomeTax,verifiedResidentTax,verifiedTotal:verified,actualEffectiveCost:verified?total-verified:null,requiredTransfers,applicationPending:rows.filter(x=>x.applicationStatus!=='confirmed').length};
}
function assertUniqueExpenseRefs(cases,donations){
  const seen=new Map();
  for(const c of cases){validateAdvance(c);for(const p of c.payments)if(p.existingExpenseRef){if(seen.has(p.existingExpenseRef))throw Error(`既存明細 ${p.existingExpenseRef} が複数案件で使われています`);seen.set(p.existingExpenseRef,c.id)}}
  validateDonations(donations);
  for(const d of donations)if(d.linkedExpenseRef){if(seen.has(d.linkedExpenseRef))throw Error(`既存明細 ${d.linkedExpenseRef} を二重紐付けできません`);seen.set(d.linkedExpenseRef,d.id)}
  return true;
}
function verifyState(state){
  if(!state||state.schema!==2||!Array.isArray(state.advances)||!Array.isArray(state.donations))throw Error('未対応のデータ形式です');
  if(state.taxReviews!=null){if(typeof state.taxReviews!=='object'||Array.isArray(state.taxReviews))throw Error('税控除の管理形式が不正です');for(const [k,v] of Object.entries(state.taxReviews)){if(!/^\d{4}:(tocchan|sae)$/.test(k)||!v||typeof v!=='object')throw Error('税控除の年・寄附者形式が不正です');if(v.limit!=null)validateMoney(v.limit,{allowZero:true});validateMoney(v.incomeTax??0,{allowZero:true});validateMoney(v.residentTax??0,{allowZero:true});}}
  const caseIds=new Set();for(const c of state.advances){validateAdvance(c);if(caseIds.has(c.id))throw Error('案件ID重複');caseIds.add(c.id);summarizeAdvance(c)}
  assertUniqueExpenseRefs(state.advances,state.donations);

const EMPTY_STATE=Object.freeze({schema:2,advances:[],donations:[]});

// Experimental isolated UI. No Firebase, no household main ledger writes.
const STORAGE='tokuhara-nextphase-prototype-20261024-v3';
const LEGACY_STORAGE='tokuhara-nextphase-prototype-20261024-v1';
const DEFAULT={schema:2,advances:[],donations:[],taxReviews:{}};
const EMBEDDED=window.parent!==window&&new URLSearchParams(location.search).has('embedded');
let state=structuredClone(DEFAULT),storageAvailable=true,bridgeReady=!EMBEDDED,bridgeFailure='',remoteRevision=null,saveBusy=false;
if(!EMBEDDED){try{const stored=JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem(LEGACY_STORAGE)||'null');state=stored?upgradeState(stored):structuredClone(DEFAULT);verifyState(state);}catch(e){storageAvailable=false;state=structuredClone(DEFAULT)}}
let requestSerial=0;const pendingRequests=new Map();
if(EMBEDDED){window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.origin!==location.origin||event.data?.channel!=='tokuhara-nextphase-rc1-result')return;
  const callback=pendingRequests.get(event.data.requestId);if(!callback)return;
  pendingRequests.delete(event.data.requestId);callback(event.data);
})}
function bridgeRequest(action,payload={}){
  if(!EMBEDDED)throw Error('組込モード以外ではクラウドへ保存しません');
  const requestId=++requestSerial;
  return new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>{pendingRequests.delete(requestId);reject(Error('アプリとの通信がタイムアウトしました'))},15000);
    pendingRequests.set(requestId,msg=>{clearTimeout(timeout);msg.ok?resolve(msg):reject(Error(msg.error||'クラウド処理に失敗しました'))});
    window.parent.postMessage({channel:'tokuhara-nextphase-rc1',requestId,action,...payload},location.origin)
  });
}
async function initializeEmbedded(){
  if(!EMBEDDED)return;
  try{
    const response=await bridgeRequest('read');
    verifyState(response.state);state=response.state;
    remoteRevision=response.revision;bridgeReady=true;bridgeFailure='';render();
  }catch(err){bridgeFailure=err.message;bridgeReady=false;render()}
}

let active='advances';let donationYear=new Date().getFullYear();let donationDonor='tocchan';let editingDonationId=null;
// RC3: dedicated entry only. No existing household expense lookup or linking controls.
// Legacy schema-2 reference fields remain read-compatible, but this UI never creates new references.

const yen=x=>x==null?'—':new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(x);
// A read-only cashflow preview, deliberately separate from the main app's finance calculation.
function monthOverview(month){
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))throw Error('対象月が不正です');
  const o={donations:0,advancePayments:0,reimbursements:0,allowances:0,internalTransfers:0};
  const applies=d=>typeof d==='string'&&d.slice(0,7)===month;

}

async function mutate(action){
  if(saveBusy){const flash=document.querySelector('#flash');flash.textContent='保存中です。完了後に操作してください。';return}
  const prior=structuredClone(state);saveBusy=true;
  try{
    action();await save();
    const flash=document.querySelector('#flash');flash.classList.remove('err');flash.textContent=EMBEDDED?'クラウド台帳に保存しました（ホーム・レポートの追加台帳込み集計に反映）':storageAvailable?'試作データを保存しました':'表示を更新しました（JSONで保全してください）';
  }catch(err){state=prior;render();const flash=document.querySelector('#flash');flash.textContent='保存・入力エラー：'+err.message;flash.classList.add('err')}
  finally{saveBusy=false}
}
